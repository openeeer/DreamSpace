workflows:
  android-demo:
    name: DreamSpace Android demo
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.1
      java: 17
    scripts:
      - name: Dependencies
        script: flutter pub get
      - name: Generate database
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze and test
        script: |
          set -euo pipefail
          flutter analyze
          flutter test
      - name: Build demo APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-compile:
    name: DreamSpace unsigned IPA for ESign
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.1
      xcode: latest
    scripts:
      - name: Dependencies
        script: flutter pub get
      - name: Generate database
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze and test
        script: |
          set -euo pipefail
          flutter analyze
          flutter test
      - name: Build iOS without signing
        script: |
          set -euo pipefail
          bash tools/check_ios_sdk.sh
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA for ESign
        script: bash tools/package_unsigned_ipa.sh
    artifacts:
      - build/ios/DreamSpace-unsigned.ipa
