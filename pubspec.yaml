name: dreamspace
description: A personal universe of dreams. Offline dream journal for iOS and Android.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  intl: ^0.20.2
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.10.0
flutter:
  uses-material-design: true
  assets:
    - assets/profile/
    - assets/backgrounds/cosmic_background.webp
    - assets/backgrounds/nebula_foreground.webp
    - assets/dreams/moon_library.webp
    - assets/dreams/ocean_without_end.webp
    - assets/dreams/red_forest.webp
    - assets/dreams/empty_city.webp
    - assets/dreams/glass_staircase.webp
    - assets/dreams/last_train.webp
    - assets/dreams/sky_islands.webp
    - assets/dreams/door_under_water.webp
    - assets/licenses/
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
